seed: 17
split_seed: 17
structure:
  mode: baseline
  baseline_reason: "reference template: shipped shared backbone + two heads, no structural change"
  baseline_sha256: "be94100059fb8b99bff5ae09a1a76629f41f211253fc39c628a3dcbe381e2265"
output_dir: runs/multitask
deployment_metric_name: ""
data:
  tasks: [recon, edge]
  batch_size: 8
  num_workers: 0
  data_path: data/multitask.npz
model:
  name: multitask
  kwargs:
    backbone:
      name: small_unet
      kwargs:
        in_channels: 1
        base: 8
        return_features: true
    heads:
      recon:
        type: conv2d
        kwargs: {in_channels: 8, out_channels: 1, kernel_size: 1}
      edge:
        type: conv2d
        kwargs: {in_channels: 8, out_channels: 1, kernel_size: 1}
module:
  type: multi_task
  tasks: [recon, edge]
  losses: {recon: mse, edge: mse}
  loss_weights: {recon: 1.0, edge: 0.5}
  metrics: {recon: [mae], edge: [mae]}
  lr: 0.001
  weight_decay: 0.0
  scheduler: null
trainer:
  max_steps: 100
  max_epochs: -1
  val_check_interval: 0.25
  accelerator: gpu
  devices: 1
  precision: 32-true
  gradient_clip_val: 0.0
  enable_progress_bar: false
  enable_model_summary: false
